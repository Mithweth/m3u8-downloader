version: 2

project_name: m3u8-downloader

builds:
  - id: darwin-amd64
    binary: m3u8-downloader
    main: ./cmd/cli
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
      - MACOSX_DEPLOYMENT_TARGET=10.13

  - id: darwin-arm64
    binary: m3u8-downloader
    main: ./cmd/cli
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: linux
    binary: m3u8-downloader
    main: ./cmd/cli
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0

archives:
  - id: m3u8-downloader
    ids:
      - linux
      - darwin-amd64
      - darwin-arm64
    formats:
      - tar.gz
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
