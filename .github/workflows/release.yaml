name: Release
on:  # yamllint disable-line rule:truthy
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Fyne Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libxkbcommon-dev

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.11

      - name: Build Linux artifacts
        run: goreleaser release --clean --skip=publish --config .goreleaser-linux.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-dist
          path: |
            dist/*.tar.gz

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.11

      - name: Build macOS artifacts
        run: goreleaser release --clean --skip=publish --config .goreleaser-darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darwin-dist
          path: |
            dist/*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs:
      - linux
      - darwin

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Upload artifacts to existing release
        working-directory: release-dist
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            *.tar.gz \
            checksums.txt \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}