name: Release
on:  # yamllint disable-line rule:truthy
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.11

      - name: Build Linux artifacts
        run: goreleaser release --clean --skip=publish --config .goreleaser-linux.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.tar.gz

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.11

      - name: Build macOS artifacts
        run: goreleaser release --clean --skip=publish --config .goreleaser-darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-dist
          path: |
            dist/*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs:
      - linux
      - darwin

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub release
        working-directory: release-dist
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            *.tar.gz \
            checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}